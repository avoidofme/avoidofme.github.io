name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7.0.1
      - name: Setup commit variables
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "PUBLIC_COMMIT_HASH=$SHORT_SHA" >> $GITHUB_ENV
          echo "PUBLIC_COMMIT_LINK=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" >> $GITHUB_ENV
      - name: Install, build, and upload site
        uses: withastro/action@v6.1.3
        env:
          PUBLIC_COMMIT_HASH: ${{ env.PUBLIC_COMMIT_HASH }}
          PUBLIC_COMMIT_LINK: ${{ env.PUBLIC_COMMIT_LINK }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
